name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      - name: Run tests
        working-directory: electron
        run: npm test

      - name: Build portable application
        working-directory: electron
        run: npm run build:win

      - name: Install NSIS
        shell: pwsh
        run: |
          winget install --id NSIS.NSIS --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          $found = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe", "$env:LOCALAPPDATA\Programs\NSIS\makensis.exe") | Where-Object { Test-Path $_ }
          if (-not $found) { choco install nsis --yes --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          $version = node -p "require('./electron/package.json').version"
          $candidates = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe", "$env:LOCALAPPDATA\Programs\NSIS\makensis.exe")
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            $makensis = (Get-ChildItem -Path "$env:ProgramFiles", "${env:ProgramFiles(x86)}", "$env:LOCALAPPDATA\Programs" -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $makensis) { throw 'makensis.exe was not found after NSIS installation.' }
          & $makensis "/DAPP_VERSION=$version" "installer\M6-Lite-Control.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m6-lite-control-windows
          path: |
            dist/M6-Lite-Control-*-Setup.exe
            dist/M6-Lite-Control-*-win32-x64

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*-Setup.exe' | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $installer.FullName --title "M6 Lite Control $env:GITHUB_REF_NAME" --generate-notes
